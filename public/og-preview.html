<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OG Image Preview — ShareTextQR</title>
    <style>
      body { font-family: system-ui, Arial; padding: 24px; background: #0f172a; color: #fff }
      .frame { background: #0f172a; padding: 20px; display: inline-block; border-radius: 8px }
      img { display:block; max-width:100%; height:auto }
      button { margin-top: 12px; padding: 8px 12px; border-radius:6px; border:0; background:linear-gradient(90deg,#6366F1,#8B5CF6); color:#fff; font-weight:600 }
    </style>
  </head>
  <body>
    <h1>OG Image Preview</h1>
    <p>Preview of <code>/og-image.svg</code>. Click "Download PNG" to rasterize in your browser.</p>
    <div class="frame">
      <img id="svgPreview" src="/og-image.svg" alt="OG preview" width="1200" height="630" />
      <div>
        <button id="downloadBtn">Download PNG (1200×630)</button>
        <button id="thumbBtn">Download Thumb (600×315)</button>
      </div>
    </div>

    <script>
      async function svgToPng(svgUrl, width, height) {
        const res = await fetch(svgUrl);
        const svgText = await res.text();
        const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.width = width;
        img.height = height;
        return new Promise((resolve, reject) => {
          img.onload = () => {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(0,0,width,height);
              ctx.drawImage(img, 0, 0, width, height);
              canvas.toBlob((blob) => resolve(blob), 'image/png');
            } catch (e) { reject(e) }
          };
          img.onerror = (e) => reject(e);
          img.src = url;
        });
      }

      document.getElementById('downloadBtn').addEventListener('click', async () => {
        try {
          const blob = await svgToPng('/og-image.svg', 1200, 630);
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'og-image.png';
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (e) { alert('Error: ' + e) }
      });

      document.getElementById('thumbBtn').addEventListener('click', async () => {
        try {
          const blob = await svgToPng('/og-image.svg', 600, 315);
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'og-image-thumb.png';
          document.body.appendChild(link);
          link.click();
          link.remove();
        } catch (e) { alert('Error: ' + e) }
      });
    </script>
  </body>
</html>
